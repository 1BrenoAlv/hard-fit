spring.application.name=hardfit-api
spring.config.import=optional:file:./.env[.properties],optional:file:./backend/.env[.properties]
server.port=${PORT:8080}
spring.datasource.url=jdbc:postgresql://localhost:5433/hardfit
spring.datasource.username=hardfit
spring.datasource.password=${HARDFIT_DB_PASSWORD:hardfit_local}
spring.sql.init.mode=always
spring.servlet.multipart.enabled=false
logging.level.org.springframework.web.servlet.mvc.support.DefaultHandlerExceptionResolver=ERROR
