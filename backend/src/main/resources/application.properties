spring.application.name=hardfit-api
spring.config.import=optional:file:./.env[.properties],optional:file:./backend/.env[.properties]
server.port=${PORT:8080}
spring.datasource.url=jdbc:postgresql://localhost:5433/hardfit
spring.datasource.username=hardfit
spring.datasource.password=${HARDFIT_DB_PASSWORD:hardfit_local}
spring.sql.init.mode=always
spring.security.user.name=${HARDFIT_ADMIN_USERNAME:admin}
spring.security.user.password=${HARDFIT_ADMIN_PASSWORD:}
hardfit.upload-directory=${HARDFIT_UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
hardfit.r2.endpoint=${R2_ENDPOINT:}
hardfit.r2.access-key-id=${R2_ACCESS_KEY_ID:}
hardfit.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
hardfit.r2.bucket=${R2_BUCKET:hardfit-images}
hardfit.r2.public-base-url=${R2_PUBLIC_BASE_URL:}
