<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cadastro confirmado na HardFit</title>
  </head>
  <body
    style="margin: 0; padding: 0; background-color: #0b130e; color: #f3f1e8"
  >
    <table
      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      bgcolor="#0b130e"
    >
      <tr>
        <td align="center" style="padding: 24px 16px">
          <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            bgcolor="#132019"
            style="max-width: 560px; border: 1px solid #344236"
          >
            <tr>
              <td style="padding: 24px 28px; border-bottom: 3px solid #cbf66d">
                <table role="presentation" cellspacing="0" cellpadding="0">
                  <tr>
                    <td style="padding-right: 12px">
                      <img
                        src="cid:hardfit-logo"
                        width="52"
                        height="44"
                        alt=""
                        style="display: block; border: 0"
                      />
                    </td>
                    <td
                      style="
                        font-family: Georgia, serif;
                        font-size: 23px;
                        font-weight: bold;
                        color: #f3f1e8;
                      "
                    >
                      HardFit Club
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 30px 28px;
                  font-family: Arial, sans-serif;
                  color: #f3f1e8;
                "
              >
                <p style="margin: 0 0 12px; font-size: 16px; line-height: 24px">
                  Olá, {{clientName}}!
                </p>
                <h1
                  style="
                    margin: 0 0 16px;
                    font-family: Georgia, serif;
                    font-size: 28px;
                    line-height: 36px;
                    color: #cbf66d;
                  "
                >
                  A mentoria HardFit vem aí
                </h1>
                <p style="margin: 0; font-size: 16px; line-height: 25px">
                  Recebemos seu cadastro. A mentoria de musculação da HardFit
                  será lançada em breve.
                </p>
                <p
                  style="
                    margin: 24px 0 0;
                    font-size: 15px;
                    line-height: 22px;
                    color: #b3b9ad;
                  "
                >
                  Equipe HardFit
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
