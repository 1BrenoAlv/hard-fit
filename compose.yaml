services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: hardfit
      POSTGRES_USER: hardfit
      POSTGRES_PASSWORD: ${HARDFIT_DB_PASSWORD:-hardfit_local}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - hardfit_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hardfit -d hardfit"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  hardfit_postgres:
